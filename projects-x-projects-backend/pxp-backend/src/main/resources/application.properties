spring.application.name=pxp-backend

server.port=${PORT:8080}
server.address=0.0.0.0

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pxp_dev}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:pxp-aziz}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql= true
spring.jpa.properties.open-in-view= false

spring.flyway.enabled= true

pxp.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

pxp.jwt.secret= ${JWT_SECRET:projectsByTheProjectsBackendSecretToken}
pxp.jwt.expires-minutes= ${JWT_EXPIRES_MINUTES:240}

pxp.admin.username=${PXP_ADMIN_USERNAME:pxp_Admin}
pxp.admin.password=${PXP_ADMIN_PASSWORD:dev-only-change-me}

pxp.r2.account_id=${R2_ACCOUNT_ID:}
pxp.r2.bucket=${R2_BUCKET:}
pxp.r2.access-key=${R2_ACCESS_KEY:}
pxp.r2.secret-key=${R2_SECRET_KEY:}
pxp.r2.public-base-url=${R2_PUBLIC_BASE_URL:}
pxp.r2.presign-minutes=${R2_PRESIGN_MINUTES:15}


pxp.site-url=${SITE_URL:http://localhost:5173}
pxp.api-public-url=${API_PUBLIC_URL:http://localhost:8080}

spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


pxp.mail.from=${MAIL_FROM:ProjectsXProjects@projectsxprojects.ca}
pxp.mail.logo-url=${MAIL_LOGO_URL:}
pxp.mail.support-email=${MAIL_SUPPORT_EMAIL:info@projectsxprojects.ca}
pxp.mail.org-name=${MAIL_ORG_NAME:Project X Projects}
pxp.mail.org-location=${MAIL_ORG_LOCATION:Ontario, Canada}

# STRIPE
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.currency=cad